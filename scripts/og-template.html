<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background-color: #17233F;
    background-image: repeating-linear-gradient(to bottom, rgba(169,130,60,0.07) 0px, rgba(169,130,60,0.07) 1px, transparent 1px, transparent 40px);
    font-family: 'Public Sans', sans-serif;
    color: #F1EAD9;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
  }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo svg { width: 52px; height: 52px; }
  .logo-text { line-height: 1.15; }
  .logo-text .name { display: block; font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px; letter-spacing: -0.5px; color: #F1EAD9; }
  .logo-text .sub { display: block; font-family: 'Public Sans', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #A9823C; margin-top: 4px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 64px; line-height: 1.12; letter-spacing: -1px; max-width: 1020px;
  }
  h1 .accent { color: #A9823C; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .tagline { font-size: 26px; color: rgba(241,234,217,0.65); font-weight: 500; }
  .badge {
    font-size: 19px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: #A9823C; border: 2px solid rgba(169,130,60,.4); background: rgba(169,130,60,.1);
    padding: 12px 24px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 72 72" fill="none"><rect width="72" height="72" rx="14" fill="#0F1830" stroke="#2A3A5E" stroke-width="1"/><path d="M23 47 L23 25 Q23 20 36 20" stroke="#A9823C" stroke-width="3.5" stroke-linecap="round"/><path d="M49 25 L49 47 Q49 52 36 52" stroke="#A9823C" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/></svg>
    <div class="logo-text">
      <span class="name">Solutions Advisory Partners</span>
      <span class="sub">AI Automation Advisory</span>
    </div>
  </div>
  <h1>AI automation for firms,<br><span class="accent">proven</span> before it scales.</h1>
  <div class="bottom">
    <div class="tagline">Law &middot; Accounting &middot; Consulting &middot; Advisory</div>
    <div class="badge">solutionsadvisorypartners.com</div>
  </div>
</body>
</html>
